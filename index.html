<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Chapecó — Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1117;
  --surface:#1a1d27;
  --surface2:#22263a;
  --border:#2a2f45;
  --border2:#353a55;
  --text:#e8eaf0;
  --text2:#8b90a7;
  --text3:#555b78;
  --accent:#4f7ef8;
  --accent2:#7c5fe6;
  --green:#22c55e;
  --red:#ef4444;
  --amber:#f59e0b;
  --purple:#a78bfa;
  --radius:10px;
  --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{font-size:14px;font-weight:700;color:var(--text)}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px}
.divider{width:1px;height:24px;background:var(--border)}
.ref{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.hdr-right{display:flex;align-items:center;gap:8px}
.hbtn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text2);font-family:'Inter',sans-serif;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .15s}
.hbtn:hover{background:var(--border);color:var(--text)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.primary:hover{background:#3d6ce8}
/* Upload */
#uarea{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 58px)}
.upload-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px;text-align:center;max-width:460px;width:100%;cursor:pointer;transition:border-color .2s}
.upload-card:hover,.upload-card.drag{border-color:var(--accent);background:var(--surface2)}
.upload-icon{font-size:48px;margin-bottom:20px;display:block}
.upload-card h2{font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text)}
.upload-card p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.upload-card .hint{font-size:11px;color:var(--text3);margin-top:14px}
/* Status bar */
#sbar{padding:10px 28px;font-size:12px;font-weight:600;display:none;font-family:'JetBrains Mono',monospace}
#sbar.ok{background:rgba(34,197,94,.1);color:var(--green);border-bottom:1px solid rgba(34,197,94,.2)}
#sbar.err{background:rgba(239,68,68,.1);color:var(--red);border-bottom:1px solid rgba(239,68,68,.2)}
/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:20px 28px 0}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-c,var(--border))}
.mc.c-green::before{background:var(--green)}
.mc.c-red::before{background:var(--red)}
.mc.c-amber::before{background:var(--amber)}
.mc.c-purple::before{background:var(--purple)}
.mc.c-accent::before{background:var(--accent)}
.mc-lb{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.mc-vl{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text)}
.mc-vl.c-green{color:var(--green)}
.mc-vl.c-red{color:var(--red)}
.mc-vl.c-amber{color:var(--amber)}
.mc-vl.c-purple{color:var(--purple)}
.mc-vl.c-accent{color:var(--accent)}
.mc-sb{font-size:10px;color:var(--text3);margin-top:4px}
/* Filters */
.filters{padding:16px 28px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fb{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;color:var(--text2);font-family:'Inter',sans-serif;font-weight:500;white-space:nowrap;transition:all .15s}
.fb:hover{border-color:var(--border2);color:var(--text)}
.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sw{margin-left:auto}
.sw input{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:12px;width:220px;font-family:'Inter',sans-serif;outline:none;color:var(--text)}
.sw input:focus{border-color:var(--accent)}
.sw input::placeholder{color:var(--text3)}
/* Table */
.tw{padding:0 28px 28px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--surface);border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--border)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text2)}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--surface)}
tbody tr.risco td{background:rgba(239,68,68,.05)}
tbody tr:last-child td{border-bottom:none}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.bp{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.bag{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.bge{background:rgba(79,126,248,.12);color:#818cf8;border:1px solid rgba(79,126,248,.2)}
.bv{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.br{background:rgba(167,139,250,.12);color:#c4b5fd;border:1px solid rgba(167,139,250,.2)}
/* Name + risk */
.aname{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;font-size:12px}
.aid{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:2px}
.rbtn{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;opacity:.2;transition:opacity .15s;line-height:1}
.rbtn:hover,.rbtn.on{opacity:1}
.rbtn.on{color:#ef4444}
/* WA btn */
.wbtn{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.25);border-radius:var(--radius-sm);padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600;color:#4ade80;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.wbtn:hover{background:rgba(37,211,102,.2)}
/* Valor colors */
.vbruto{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:12px}
.vhub{color:var(--green);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.vcto-late{color:var(--red);font-weight:600;font-family:'JetBrains Mono',monospace}
.vcto-ok{font-family:'JetBrains Mono',monospace;color:var(--text2)}
/* Empty */
.empty{text-align:center;padding:60px;color:var(--text3)}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 28px;margin-top:4px}
.tab{padding:10px 20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:Inter,sans-serif;letter-spacing:.02em}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none}.page.active{display:block}
/* Analytics */
.analytics{padding:20px 28px}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.an-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.chart-card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:16px}
.chart-wrap{position:relative}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi-lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.kpi-vl{font-size:28px;font-weight:700;font-family:JetBrains Mono,monospace}
.kpi-sub{font-size:11px;color:var(--text3)}
.progress-wrap{margin-top:8px}
.progress-lb{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:6px;font-family:JetBrains Mono,monospace}
.progress-bar{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}
/* Print */
@media print{
  body{background:white;color:#111}
  .hdr-right,.filters .sw,.wbtn,.rbtn{display:none!important}
  .hdr{background:#fff;border-color:#eee;position:relative}
  .mc{background:#f9f9f9;border-color:#eee}
  table{font-size:10px}
  th,td{padding:6px 8px}
  .mc-vl,.aname,.vhub,.vcto-late{color:#111!important}
  tbody tr:hover td{background:transparent}
  @page{margin:1cm;size:landscape}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div>
        <div class="logo-text">Happy Chapecó</div>
        <div class="logo-sub">Painel Financeiro</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="ref" id="refp">—</div>
  </div>
  <div class="hdr-right">
    <button class="hbtn" onclick="document.getElementById('fi').click()">↑ Importar</button>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="handleFile(event)">
    <button class="hbtn" id="exportbtn" style="display:none" onclick="exportXLSX()">⬇ Excel</button>
    <button class="hbtn" id="printbtn" style="display:none" onclick="window.print()">⎙ Imprimir</button>
    <button class="hbtn primary" onclick="document.getElementById('fi').click()">⟳ Atualizar</button>
  </div>
</header>

<div id="sbar" class="sbar"></div>
<div class="tabs" id="maintabs" style="display:none">
  <button class="tab active" onclick="switchTab('painel',this)">📋 Painel</button>
  <button class="tab" onclick="switchTab('analytics',this)">📊 Analytics</button>
</div>

<div id="uarea">
  <div class="upload-card" id="dz" onclick="document.getElementById('fi').click()">
    <span class="upload-icon">📊</span>
    <h2>Importe o relatório do Space</h2>
    <p>Acesse <strong>space.happy.com.br</strong><br>Relatório → Financeiro Detalhado → Exportar CSV</p>
    <button class="hbtn primary" style="margin:0 auto">Selecionar arquivo .xlsx</button>
    <div class="hint">Arraste e solte o arquivo aqui ou clique para selecionar</div>
  </div>
</div>

<div id="page-painel" class="page active"><div id="dash" style="display:none">
  <div class="metrics" id="mets"></div>
  <div class="filters">
    <button class="fb active" onclick="setF('todos',this)">Todos</button>
    <button class="fb" onclick="setF('vencidos',this)">Vencidos</button>
    <button class="fb" onclick="setF('avencer',this)">A vencer</button>
    <button class="fb" onclick="setF('pagos',this)">Pagos</button>
    <button class="fb" onclick="setF('disparar',this)">Disparar hoje</button>
    <button class="fb" onclick="setF('15d',this)">Fim em 15d</button>
    <button class="fb" onclick="setF('30d',this)">Fim em 30d</button>
    <button class="fb" onclick="setF('60d',this)">Fim em 60d</button>
    <button class="fb" onclick="setF('90d',this)">Fim em 90d</button>
    <div class="sw"><input type="text" id="srch" placeholder="Buscar aluno ou responsável..." oninput="renderT()"></div>
  </div>
  <div class="filters" id="curso-filters" style="padding-top:0;gap:6px">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600;margin-right:4px">Curso:</span>
    <button class="fb active" onclick="setCurso('todos',this)">Todos</button>
    <button class="fb" onclick="setCurso('robotica_ini',this)">Robótica Iniciante</button>
    <button class="fb" onclick="setCurso('robotica_int',this)">Robótica Intermediário</button>
    <button class="fb" onclick="setCurso('robotica_avan',this)">Robótica Avançado</button>
    <button class="fb" onclick="setCurso('arduino',this)">Robótica Arduino</button>
    <button class="fb" onclick="setCurso('games',this)">Dev Games</button>
    <button class="fb" onclick="setCurso('apps',this)">Dev Apps</button>
    <button class="fb" onclick="setCurso('comunicador',this)">Comunicador</button>
    <button class="fb" onclick="setCurso('teen',this)">Teen Track</button>
    <button class="fb" onclick="setCurso('junior',this)">Junior Track</button>
  </div>
  <div class="tw">
    <table>
      <thead><tr>
        <th style="min-width:190px">ALUNO</th>
        <th style="min-width:150px">RESPONSÁVEL</th>
        <th style="min-width:160px">CURSO</th>
        <th style="width:72px">VCTO</th>
        <th style="width:72px">PGTO</th>
        <th style="width:100px">BRUTO</th>
        <th style="width:100px">HUB</th>
        <th class="sortable" style="width:90px" id="thfim" onclick="toggleSortFim(this)">FIM ↕</th>
        <th style="width:100px">STATUS</th>
        <th style="width:110px">ALERTA</th>
        <th style="width:90px">WA</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div></div>

<div id="page-analytics" class="page">
  <div class="analytics" id="analytics-content"></div>
</div>

<script>
var allData = [];
var HISTORICO = {"2026-01":{"alunos":5,"pagos":5,"hub_pago":1161.74,"hub_potencial":1161.74,"em_aberto":0.0,"tx_pagamento":100.0,"novos":5,"churned":0,"churn_rate":0.0,"retencao":100.0},"2026-02":{"alunos":9,"pagos":9,"hub_pago":2242.21,"hub_potencial":2242.21,"em_aberto":0.0,"tx_pagamento":100.0,"novos":4,"churned":0,"churn_rate":0.0,"retencao":100.0},"2026-03":{"alunos":20,"pagos":20,"hub_pago":6029.92,"hub_potencial":6029.92,"em_aberto":0.0,"tx_pagamento":100.0,"novos":11,"churned":0,"churn_rate":0.0,"retencao":100.0},"2026-04":{"alunos":26,"pagos":26,"hub_pago":7779.39,"hub_potencial":7779.39,"em_aberto":0.0,"tx_pagamento":100.0,"novos":6,"churned":0,"churn_rate":0.0,"retencao":100.0},"2026-05":{"alunos":32,"pagos":31,"hub_pago":9304.02,"hub_potencial":9577.34,"em_aberto":323.0,"tx_pagamento":96.9,"novos":6,"churned":0,"churn_rate":0.0,"retencao":100.0},"2026-06":{"alunos":39,"pagos":37,"hub_pago":10989.17,"hub_potencial":11590.37,"em_aberto":713.0,"tx_pagamento":94.9,"novos":8,"churned":1,"churn_rate":3.1,"retencao":96.9},"2026-07":{"alunos":44,"pagos":41,"hub_pago":12200.82,"hub_potencial":13126.12,"em_aberto":1093.0,"tx_pagamento":93.2,"novos":5,"churned":0,"churn_rate":0.0,"retencao":100.0},"2026-08":{"alunos":44,"pagos":41,"hub_pago":12263.63,"hub_potencial":13245.93,"em_aberto":1150.0,"tx_pagamento":93.2,"novos":2,"churned":2,"churn_rate":4.5,"retencao":95.5}};
var curF = 'todos';
var sortFim = false;
var curCurso = 'todos';
window._risco = new Set();

var dz = document.getElementById('dz');
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('drag'); });
dz.addEventListener('drop', function(e){ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); });

function handleFile(e){ if(e.target.files[0]) processFile(e.target.files[0]); }

function processFile(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var wb = XLSX.read(e.target.result, {type:'binary', raw:false});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
      if(!rows || !rows.length){ showErr('Arquivo vazio'); return; }
      if(!rows[0].hasOwnProperty('ALUNO')){ showErr('Formato inválido — use o exportado do Space'); return; }
      allData = parseRows(rows);
      showDash();
      showOk('✓ ' + allData.length + ' alunos carregados · ' + new Date().toLocaleTimeString('pt-BR'));
    } catch(err){
      showErr('Erro ao processar arquivo: ' + err.message);
    }
  };
  reader.onerror = function(){ showErr('Erro ao ler o arquivo.'); };
  reader.readAsBinaryString(file);
}

function parseRows(rows){
  var today = new Date(); today.setHours(0,0,0,0);
  // Pré-processamento: coletar nomes que têm Pago (normalizado uppercase)
  var pagoNomes = {};
  rows.forEach(function(r){
    if(String(r['STATUS_PARCELA']||'').trim() === 'Pago')
      pagoNomes[String(r['ALUNO']||'').trim().toUpperCase()] = true;
  });

  var map = {};
  rows.forEach(function(r){
    var sa = String(r['STATUS_ALUNO']||'').trim();
    var sm = String(r['STATUS_MATRICULA']||'').trim();
    var sp = String(r['STATUS_PARCELA']||'').trim();
    var nome = String(r['ALUNO']||'').trim();
    var nomeUp = nome.toUpperCase();
    var idFin = String(r['ID_FINANCEIRO']||'').trim();
    var key = nomeUp + '__' + idFin;
    var parcAtual = parseInt(r['PARCELA_ATUAL']) || 0;

    if(sa !== 'Ativo') return;
    if(sm !== 'Matriculado') return;
    if(!sp || sp === 'Cancelado' || sp === 'Isento') return;
    if(parcAtual < 1) return;

    // Ignorar REPACTUADO sempre que o aluno tiver qualquer registro Pago
    if(sp === 'REPACTUADO' && pagoNomes[nomeUp]) return;

    // Se já existe este key no map
    if(map[key]){
      // Se nova linha é Pago, sobrescreve tudo
      if(sp === 'Pago'){
        map[key].statusP = 'Pago';
        map[key].valor = parseFloat(r['VL_PARCELA'])||map[key].valor;
        map[key].hub = parseFloat(r['VL_PARCELA_HUB'])||map[key].hub;
        map[key].pgto = fmtD(String(r['C31_DT_PAGAMENTO']||''));
        map[key].alerta = 'Pago';
      }
      return;
    }

    var vctoStr = String(r['C30_DT_VENCIMENTO_PARCELA']||'').trim();
    var pgtoStr = String(r['C31_DT_PAGAMENTO']||'').trim();
    var vctoD = parseD(vctoStr);
    var diff = vctoD ? Math.floor((vctoD.getTime()-today.getTime())/86400000) : null;

    // Fim do contrato
    var iniStr = String(r['C29_DT_INICIO_CONTRATO']||'').trim();
    var nParc = parseInt(String(r['PARCELAMENTO_CONTRATO']||'').trim())||0;
    var diffFim = null;
    var iniP = iniStr.split('/');
    if(iniP.length===3 && nParc>0){
      var iD=parseInt(iniP[0]), iM=parseInt(iniP[1]), iY=parseInt(iniP[2]);
      if(!isNaN(iD)&&!isNaN(iM)&&!isNaN(iY)&&iY>2000){
        var totM = (iY*12+iM-1)+nParc;
        var fY=Math.floor(totM/12), fM=(totM%12)+1;
        var fimD=new Date(fY,fM-1,iD);
        if(isNaN(fimD.getTime())) fimD=new Date(fY,fM-1,28);
        diffFim=Math.floor((fimD.getTime()-today.getTime())/86400000);
      }
    }

    var labelP = sp==='Pago'?'Pago':sp==='A gerar'?'A gerar':sp==='Gerado'?'Gerado':sp==='REPACTUADO'?'Repactuado':sp;
    var alerta = '';
    if(sp==='Pago') alerta='Pago';
    else if(diff!==null){
      if(diff<0) alerta='Vencido '+Math.abs(diff)+'d';
      else if(diff===0) alerta='Vence hoje';
      else if(diff===1) alerta='Vence amanhã';
      else if(diff<=5) alerta='Vence em '+diff+'d';
      else alerta=fmtD(vctoStr);
    }

    map[key]={
      nome:nome, resp:String(r['RESPONSAVEL_FINANCEIRO']||'').trim(),
      curso:String(r['CURRICULO']||'').trim(),
      vcto:fmtD(vctoStr), pgto:fmtD(pgtoStr), diff:diff,
      valor:parseFloat(r['VL_PARCELA'])||0, hub:parseFloat(r['VL_PARCELA_HUB'])||0,
      statusP:labelP, alerta:alerta,
      idMat:String(r['ID_MATRICULA']||'').trim(),
      tipo:String(r['TIPO_PAGAMENTO']||'').trim(), diffFim:diffFim,
    };
  });
  return Object.values(map).sort(function(a,b){ return a.nome.localeCompare(b.nome); });
}

function parseD(s){
  if(!s||s==='00/00/0000') return null;
  s=String(s).trim();
  var p=s.split('/');
  if(p.length===3){
    var d=parseInt(p[0]),m=parseInt(p[1]),y=parseInt(p[2]);
    if(d>0&&m>0&&y>2000) return new Date(y,m-1,d);
  }
  return null;
}
function fmtD(s){
  if(!s||s==='00/00/0000') return '-';
  var d=parseD(s); if(!d) return '-';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}

function detectMes(data){

  if(p.length===2){
    var m=parseInt(p[1])||parseInt(p[0]);
    var y=new Date().getFullYear();
    return y+'-'+(m<10?'0':'')+m;
  }
  return null;
}

function getCursoData(){
  var cats = {};
  var catMap = function(c){
    c = String(c).toLowerCase();
    if(c.includes('lego iniciante')) return 'Robótica Iniciante';
    if(c.includes('lego intermediário')||c.includes('lego intermediario')) return 'Robótica Intermediário';
    if(c.includes('lego avançado')||c.includes('lego avancado')) return 'Robótica Avançado';
    if(c.includes('arduino')) return 'Arduino';
    if(c.includes('games')) return 'Dev Games';
    if(c.includes('apps')||c.includes('python')) return 'Dev Apps';
    if(c.includes('comunicador')) return 'Comunicador';
    if(c.includes('teen track')) return 'Teen Track';
    if(c.includes('junior track')) return 'Junior Track';
    return 'Outros';
  };
  allData.forEach(function(r){
    var cat = catMap(r.curso);
    if(!cats[cat]) cats[cat]={alunos:0,pago:0,aberto:0,pagos:0};
    cats[cat].alunos++;
    if(r.statusP==='Pago'){cats[cat].pago+=r.hub; cats[cat].pagos++;}
    else cats[cat].aberto+=r.valor;
  });
  return cats;
}

    '<th style="text-align:left;padding:8px 12px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em">Curso</th>' +
    '<th style="text-align:right;padding:8px 12px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em">Alunos</th>' +
    '<th style="text-align:right;padding:8px 12px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em">%</th>' +
    '<th style="text-align:right;padding:8px 12px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em">Pagos</th>' +
    '<th style="text-align:right;padding:8px 12px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em">HUB Pago</th>' +
    '<th style="text-align:right;padding:8px 12px;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em">Em Aberto</th>' +
    '</tr></thead><tbody>' +
    labels.map(function(k,i){
      var d=cats[k];
      var pctC=(d.alunos/totalAlunos*100).toFixed(1);
      return '<tr style="border-bottom:1px solid var(--border)">'+
        '<td style="padding:9px 12px;color:var(--text);display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:'+colors[i%colors.length]+';display:inline-block"></span>'+k+'</td>'+
        '<td style="padding:9px 12px;text-align:right;font-family:JetBrains Mono,monospace;color:var(--text2)">'+d.alunos+'</td>'+
        '<td style="padding:9px 12px;text-align:right;font-family:JetBrains Mono,monospace;color:var(--text3)">'+pctC+'%</td>'+
        '<td style="padding:9px 12px;text-align:right;font-family:JetBrains Mono,monospace;color:var(--green)">'+d.pagos+'</td>'+
        '<td style="padding:9px 12px;text-align:right;font-family:JetBrains Mono,monospace;color:var(--green)">'+f(d.pago)+'</td>'+
        '<td style="padding:9px 12px;text-align:right;font-family:JetBrains Mono,monospace;color:var(--red)">'+f(d.aberto)+'</td>'+
      '</tr>';
    }).join('') +
    '</tbody></table></div>';

  var chartOpts = {
    plugins:{legend:{labels:{color:'#8b90a7',font:{family:'Inter',size:11}}}},
    scales:{x:{ticks:{color:'#555b78',font:{family:'Inter',size:10}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#555b78',font:{family:'Inter',size:10}},grid:{color:'rgba(255,255,255,.04)'}}}
  };

  // Pie chart
  _charts.pie = new Chart(document.getElementById('chartPie'), {
    type:'doughnut',
    data:{labels:labels, datasets:[{data:alunos, backgroundColor:colors.slice(0,labels.length), borderColor:'#1a1d27', borderWidth:3, hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{color:'#8b90a7',font:{family:'Inter',size:11},padding:12,usePointStyle:true}}}}
  });

  // Stacked bar
  _charts.bar = new Chart(document.getElementById('chartBar'), {
    type:'bar',
    data:{labels:labels, datasets:[
      {label:'HUB Pago',data:pagos,backgroundColor:'rgba(34,197,94,.7)',borderColor:'rgba(34,197,94,1)',borderWidth:1,borderRadius:4},
      {label:'Em Aberto',data:aberto,backgroundColor:'rgba(239,68,68,.4)',borderColor:'rgba(239,68,68,.7)',borderWidth:1,borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:chartOpts.plugins,scales:{x:{stacked:false,...chartOpts.scales.x},y:{stacked:false,...chartOpts.scales.y}}}
  });

  // Horizontal bar
  // History charts
  var lineDefaults = {fill:true,tension:.4,pointRadius:4,pointHoverRadius:6,borderWidth:2};
  _charts.histAlunos = new Chart(document.getElementById('chartHistAlunos'), {
    type:'line',
    data:{labels:histLabels,datasets:[{label:'Alunos ativos',data:histAlunos,...lineDefaults,borderColor:'#4f7ef8',backgroundColor:'rgba(79,126,248,.1)',pointBackgroundColor:'#4f7ef8'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#555b78',font:{family:'Inter',size:10}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#555b78',font:{family:'Inter',size:10},stepSize:5},grid:{color:'rgba(255,255,255,.04)'},min:0}}}
  });
  _charts.histHub = new Chart(document.getElementById('chartHistHub'), {
    type:'line',
    data:{labels:histLabels,datasets:[
      {label:'HUB Potencial',data:histPotencial,...lineDefaults,borderColor:'#a78bfa',backgroundColor:'rgba(167,139,250,.08)',pointBackgroundColor:'#a78bfa'},
      {label:'HUB Pago',data:histHubPago,...lineDefaults,borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.1)',pointBackgroundColor:'#22c55e'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b90a7',font:{family:'Inter',size:11}}}},scales:{x:{ticks:{color:'#555b78',font:{family:'Inter',size:10}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#555b78',font:{family:'Inter',size:10},callback:function(v){return 'R$'+v.toLocaleString('pt-BR');}},grid:{color:'rgba(255,255,255,.04)'}}}}
  });
  _charts.histChurn = new Chart(document.getElementById('chartHistChurn'), {
    type:'bar',
    data:{labels:histLabels,datasets:[
      {label:'Novos',data:histNovos,backgroundColor:'rgba(34,197,94,.7)',borderRadius:4},
      {label:'Saídas',data:histChurned,backgroundColor:'rgba(239,68,68,.7)',borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b90a7',font:{family:'Inter',size:11}}}},scales:{x:{ticks:{color:'#555b78',font:{family:'Inter',size:10}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#555b78',font:{family:'Inter',size:10},stepSize:1},grid:{color:'rgba(255,255,255,.04)'},min:0}}}
  });
  _charts.histTx = new Chart(document.getElementById('chartHistTx'), {
    type:'line',
    data:{labels:histLabels,datasets:[{label:'% Pagamento',data:histTxPgto,...lineDefaults,borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,.1)',pointBackgroundColor:'#f59e0b'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#555b78',font:{family:'Inter',size:10}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#555b78',font:{family:'Inter',size:10},callback:function(v){return v+'%';}},grid:{color:'rgba(255,255,255,.04)'},min:0,max:100}}}
  });

  _charts.horiz = new Chart(document.getElementById('chartHoriz'), {
    type:'bar',
    data:{labels:labels, datasets:[{label:'Alunos',data:alunos,backgroundColor:colors.slice(0,labels.length),borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#555b78',font:{family:'Inter',size:10},stepSize:1},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#8b90a7',font:{family:'Inter',size:11}},grid:{display:false}}}}
  });
}

function showOk(msg){var b=document.getElementById('sbar');b.textContent=msg;b.className='sbar ok';b.style.display='block';setTimeout(function(){b.style.display='none';},6000);}
function showErr(msg){var b=document.getElementById('sbar');b.textContent='✕ '+msg;b.className='sbar err';b.style.display='block';}
</script>
</body>
</html>
